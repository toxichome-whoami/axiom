version: "3.8"

services:
    # Axiom — Rust native binary, no interpreter overhead
    axiom:
        build: .
        image: axiom:latest
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - ./logs:/app/logs
        environment:
            - RUST_LOG=info
        deploy:
            replicas: 3
            update_config:
                parallelism: 1
                delay: 10s
        # In production, do not expose ports directly to the host.
        # NGINX routes all external traffic to the replicas.
        expose:
            - "4500" # HTTP / REST API

    # NGINX Load Balancer — routes HTTP to :4500
    nginx:
        image: nginx:alpine
        container_name: axiom_lb
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - axiom
        restart: unless-stopped
