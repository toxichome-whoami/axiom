[package]
name = "axiom"
version = "3.0.0"
edition = "2021"
description = "Axiom API Gateway Backend"

[dependencies]
dashmap = "5.5"

hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

tokio = { version = "1.37.0", features = ["full"] }
libsql = "0.9.30"
serde_json = "1.0.116"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.8", features = ["v4", "v7"] }
regex = "1.10"
base64 = "0.22.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"] }
rand = "0.8.5"
toml = "0.8.19"
url = "2.5"
once_cell = "1.19.0"
chrono = "0.4"
axum = "0.7.5"
tower = "0.4.13"
tower-http = { version = "0.5.2", features = ["cors", "trace", "set-header", "compression-gzip", "request-id", "util", "timeout"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
urlencoding = "2.1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
sqlx = { version = "0.8.0", features = ["runtime-tokio-rustls", "any", "postgres", "mysql", "json"] }
async-trait = "0.1.80"
futures = "0.3.30"
tokio-stream = "0.1.15"
bytes = "1.6"

figment = { version = "0.10.19", features = ["toml", "env"] }
dotenvy = "0.15.7"
sysinfo = "0.38.4"
ring = "0.17.14"
sqlparser = "0.62.0"
mimalloc = { version = "0.1", default-features = false, features = ["secure"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "tokio", "tokio-util"] }
clickhouse = { version = "0.12", features = ["lz4"] }


[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
