name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            bin: axiom
            archive: tar.gz

          # Linux arm64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            bin: axiom
            archive: tar.gz

          # Darwin amd64 (macOS Intel)
          - os: macos-13
            target: x86_64-apple-darwin
            platform: darwin_amd64
            bin: axiom
            archive: tar.gz

          # Darwin arm64 (macOS Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin_arm64
            bin: axiom
            archive: tar.gz

          # Windows amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows_amd64
            bin: axiom.exe
            archive: zip

          # Windows arm64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows_arm64
            bin: axiom.exe
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Web UI
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          
          PKG="axiom_${TAG}_${{ matrix.platform }}"
          mkdir -p "staging/${PKG}"
          
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "staging/${PKG}/"
          cp README.md LICENSE "staging/${PKG}/" 2>/dev/null || true
          
          cd staging
          tar -czvf "../${PKG}.tar.gz" "${PKG}"
          cd ..
          
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $TAG = "${{ inputs.tag_name }}"
          }
          
          $PKG = "axiom_${TAG}_${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "staging/${PKG}" | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "staging/${PKG}/"
          Copy-Item "README.md", "LICENSE" "staging/${PKG}/" -ErrorAction SilentlyContinue
          
          Compress-Archive -Path "staging/${PKG}" -DestinationPath "${PKG}.zip"
          
          $hash = (Get-FileHash -Algorithm SHA256 "${PKG}.zip").Hash.ToLower()
          "$hash  ${PKG}.zip" | Out-File -Encoding ascii "${PKG}.zip.sha256"

      - name: Add Files to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            axiom_*.tar.gz
            axiom_*.tar.gz.sha256
            axiom_*.zip
            axiom_*.zip.sha256
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
