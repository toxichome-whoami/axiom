name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            bin: axiom
            archive: tar.gz

          # Linux arm64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            bin: axiom
            archive: tar.gz

          # Darwin amd64 (macOS Intel)
          - os: macos-14
            target: x86_64-apple-darwin
            platform: darwin_amd64
            bin: axiom
            archive: tar.gz

          # Darwin arm64 (macOS Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin_arm64
            bin: axiom
            archive: tar.gz

          # Windows amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows_amd64
            bin: axiom.exe
            archive: zip

          # Windows arm64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows_arm64
            bin: axiom.exe
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Web UI
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          
          PKG="axiom_${TAG}_${{ matrix.platform }}"
          mkdir -p "staging/${PKG}"
          
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "staging/${PKG}/"
          cp README.md LICENSE "staging/${PKG}/" 2>/dev/null || true
          
          cd staging
          tar -czvf "../${PKG}.tar.gz" "${PKG}"
          cd ..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $TAG = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $TAG = "${{ inputs.tag_name }}"
          }
          
          $PKG = "axiom_${TAG}_${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "staging/${PKG}" | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "staging/${PKG}/"
          Copy-Item "README.md", "LICENSE" "staging/${PKG}/" -ErrorAction SilentlyContinue
          
          tar.exe -a -cf "${PKG}.zip" -C staging "${PKG}"

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            axiom_*.tar.gz
            axiom_*.zip
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: |
            *.tar.gz
            *.zip
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ""
