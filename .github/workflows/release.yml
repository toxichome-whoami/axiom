name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.1.12)'
        required: false
        default: 'v0.1.12'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: axiom
            archive_format: tar.gz

          # Linux ARM64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: axiom
            archive_format: tar.gz

          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: axiom
            archive_format: tar.gz

          # macOS Apple Silicon (M-series ARM64)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: axiom
            archive_format: tar.gz

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: axiom.exe
            archive_format: zip

          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: axiom.exe
            archive_format: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI Frontend
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Archive & Generate Checksum (Linux / macOS)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ "${RELEASE_TAG}" = "main" ] || [ -z "${RELEASE_TAG}" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name || 'v0.1.12' }}"
          fi
          
          PKG_NAME="axiom-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "staging/${PKG_NAME}"
          
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "staging/${PKG_NAME}/"
          cp README.md LICENSE "staging/${PKG_NAME}/"
          
          cd staging
          tar -czvf "../${PKG_NAME}.tar.gz" "${PKG_NAME}"
          cd ..
          
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Package Archive & Generate Checksum (Windows)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          $RELEASE_TAG = "${{ github.ref_name }}"
          if ($RELEASE_TAG -eq "main" -or [string]::IsNullOrEmpty($RELEASE_TAG)) {
            $RELEASE_TAG = "${{ github.event.inputs.tag_name }}"
            if ([string]::IsNullOrEmpty($RELEASE_TAG)) { $RELEASE_TAG = "v0.1.12" }
          }
          
          $PKG_NAME = "axiom-${RELEASE_TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "staging/${PKG_NAME}" | Out-Null
          
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "staging/${PKG_NAME}/"
          Copy-Item "README.md", "LICENSE" "staging/${PKG_NAME}/"
          
          Compress-Archive -Path "staging/${PKG_NAME}" -DestinationPath "${PKG_NAME}.zip"
          
          $hash = (Get-FileHash -Algorithm SHA256 "${PKG_NAME}.zip").Hash.ToLower()
          "$hash  ${PKG_NAME}.zip" | Out-File -Encoding ascii "${PKG_NAME}.zip.sha256"

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            axiom-*.tar.gz
            axiom-*.tar.gz.sha256
            axiom-*.zip
            axiom-*.zip.sha256
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name || 'v0.1.12' }}
          draft: false
          prerelease: false
          generate_release_notes: true
