version: "3.9"

services:
    axiom:
        build: .
        ports:
            - "4500:4500" # HTTP / REST API
        env_file:
            - .env
        volumes:
            - ./logs:/app/logs
        restart: unless-stopped
        depends_on:
            - redis

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
