[package]
name = "axiom-sdk"
version = "1.0.0"
edition = "2021"
description = "Official Rust SDK for the Axiom API Gateway"
authors = ["Toxichome <admin@toxichome.cc>"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tokio = { version = "1.0", features = ["full"] }

